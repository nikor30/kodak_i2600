# kodak_i2x00 backend configuration

# USB ids to look for. The i2600 is built in; other models of the family
# (i2400, i2800) are untested and can be added here.
usb 0x040a 0x601d

# Scan start sequence (color 300 dpi duplex). The register values in it were
# captured from one unit and may be unit-specific.
#sequence /usr/share/sane/kodak_i2x00/color300-duplex.seq

# Text on the scanner's display next to a function number (1-9), ASCII only.
# Up to about 30 characters are shown large, longer texts small. The scanner
# forgets the labels when it is switched off; they are sent at every open.
#label 1 Paperless Color
#label 2 Paperless Gray

# After the scanner was switched off and on it needs its firmware. With a local
# power-up file the backend loads it itself (about 10 s at the first open):
#   tools/usbcap/extract_powerup.py CAPTURE.pcap DIR      -> powerup.json + powerup.bin
#   backend/tools/powerup2seq.py DIR/powerup.json DIR/powerup.seq
# The files contain Kodak's firmware: keep them on your machine.
#powerup /etc/kodak-scan/firmware/powerup.seq

# The scanner feeds a whole stack without waiting for the host. Raw pages that
# the frontend has not fetched yet are kept in memory up to this number
# (30 MB each), further ones go to files in spool-dir.
#memory-pages 4
#spool-dir /var/tmp
